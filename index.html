<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Suma - GitHub Pages</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fce7f3; /* Rosa pastel suave */
      color: #831843;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #ffffff;
      border: 1px solid #fbcfe8;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(219, 39, 119, 0.15);
      width: 320px;
      text-align: center;
    }
    h2 { 
      color: #db2777; 
      margin-bottom: 20px; 
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #fbcfe8;
      background-color: #fff5f7;
      color: #831843;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: #f472b6;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      background-color: #ec4899;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover { 
      background-color: #db2777; 
    }
    .result {
      margin-top: 20px;
      padding: 12px;
      background-color: #fbcfe8;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #9d174d;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🧮 Suma Interactiva</h2>
    <input type="number" id="num1" placeholder="Ingresa el primer número">
    <input type="number" id="num2" placeholder="Ingresa el segundo número">
    <button onclick="sumar()">Calcular Suma 🔥</button>
    <div class="result" id="resultado">Resultado: --</div>
  </div>

  <script>
    function sumar() {
      const n1 = parseFloat(document.getElementById('num1').value) || 0;
      const n2 = parseFloat(document.getElementById('num2').value) || 0;
      document.getElementById('resultado').innerText = `Resultado: ${n1 + n2}`;
    }
  </script>
</body>
</html>
